spring.application.name=helpdesk

# ===============================
# Supabase
# ===============================
supabase.url=https://abkxnzzffuojvumrhlrw.supabase.co
supabase.key=${SUPABASE_KEY:}
supabase.bucket=Image

# ===============================
# File Upload
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===============================
# Local PostgreSQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/helpdesk_db
spring.datasource.username=postgres
spring.datasource.password=123

# ===============================
# Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Server
# ===============================
server.port=8080
server.address=0.0.0.0

# ===============================
# JWT Configuration
# ===============================
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS0yNTYtYml0LXNlY3JldC1rZXktZm9yLWhlbHBkZXNrLWFwcA==}
jwt.expiration-ms=900000

# ===============================
# Jackson ISO-8601 UTC
# ===============================
spring.jackson.time-zone=UTC

# ===============================
# OpenAPI / Swagger
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
